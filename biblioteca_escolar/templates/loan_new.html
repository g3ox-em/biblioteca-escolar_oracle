{% extends 'base.html' %}
{% block content %}
<p class="eyebrow">CIRCULACIÓN</p>
<h1>Registrar préstamo</h1>
<form class="panel form-grid" method="post" onsubmit="return confirm('¿Confirmar préstamo y descontar un ejemplar de la biblioteca?')">
<input type="hidden" name="csrf" value="{{ session.csrf }}">
<label>Estudiante (Carnet y nombre) *
<select name="estudiante" required>
<option value="">Selecciona un estudiante</option>
{% for s in students %}
<option value="{{ s.id_estudiante }}">{{ s.nombre }}</option>
{% endfor %}
</select>
</label>
<label>Libro con ejemplares disponibles *
<select name="libro" required>
<option value="">Selecciona un libro</option>
{% for b in books %}
<option value="{{ b.id_libro }}">{{ b.titulo }} · ({{ b.disponible }} disponibles)</option>
{% endfor %}
</select>
</label>
<label>Fecha de préstamo *
<input name="fecha" type="date" value="{{ today }}" max="{{ today }}" required>
</label>
<label>Fecha límite de devolución *
<input name="limite" type="date" required>
</label>
<p class="hint">Regla del sistema: Se permite un máximo de 3 libros simultáneos por estudiante. Si el estudiante tiene algún libro atrasado, el sistema rechazará la solicitud.</p>
<div class="actions">
<button>Confirmar préstamo</button>
<a href="/prestamos">Cancelar</a>
</div>
</form>
{% endblock %}
