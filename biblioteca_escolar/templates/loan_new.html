{% extends 'base.html' %}{% block content %}<p class="eyebrow">CIRCULACIÓN</p><h1>Registrar préstamo</h1><form class="panel form-grid" method="post" onsubmit="return confirm('¿Confirmar préstamo y descontar un ejemplar?')"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Estudiante<select name="estudiante" required><option value="">Selecciona</option>{% for s in students %}<option value="{{ s.id_estudiante }}">{{ s.nombre }}</option>{% endfor %}</select></label><label>Libro disponible<select name="libro" required><option value="">Selecciona</option>{% for b in books %}<option value="{{ b.id_libro }}">{{ b.titulo }} · {{ b.disponible }} disponibles</option>{% endfor %}</select></label><label>Fecha de préstamo<input name="fecha" type="date" value="{{ today }}" max="{{ today }}" required></label><label>Fecha límite<input name="limite" type="date" required></label><div class="actions"><button>Confirmar préstamo</button><a href="/prestamos">Cancelar</a></div></form>{% endblock %}
